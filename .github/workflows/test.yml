# Lint and bump-rule tests for actions/version-bump. Runs on pushes to main and on pull requests.
#
# GitHub-hosted ubuntu-latest runner.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck yamllint >/dev/null
      - name: shellcheck
        run: shellcheck -x actions/version-bump/scripts/get_next_version.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: yamllint
        run: yamllint -c .yamllint.yml .github actions/version-bump/action.yml

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats python3-yaml >/dev/null
      - name: Run tests
        run: bats --print-output-on-failure tests/
